name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$SDKROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Prepare V3.7.0 artifacts and local signing tools
        run: |
          mkdir -p dist/signing-tools
          cp app/build/outputs/apk/debug/app-debug.apk "dist/心理老师工作台-V3.7.0-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/心理老师工作台-V3.7.0-release-unsigned.apk"
          cp "$SDKROOT/build-tools/35.0.0/lib/apksigner.jar" dist/signing-tools/apksigner.jar
          cp "$SDKROOT/build-tools/35.0.0/zipalign" dist/signing-tools/zipalign
          chmod +x dist/signing-tools/zipalign
          sha256sum dist/*.apk > dist/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy-workbench-android-v3.7.0-build
          path: dist/**
          if-no-files-found: error
