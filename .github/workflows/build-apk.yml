name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$SDKROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/心理老师工作台-V3.6.1.apk"
          sha256sum "dist/心理老师工作台-V3.6.1.apk" > "dist/心理老师工作台-V3.6.1_SHA256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: psy-workbench-android-v3.6.1
          path: dist/*
          if-no-files-found: error
